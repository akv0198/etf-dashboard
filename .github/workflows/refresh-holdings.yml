name: Refresh ETF holdings

on:
  schedule:
    - cron: '43 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Refresh market data and holdings list
        run: npm run refresh:data
        env:
          REFRESH_HOLDINGS: '1'
      - run: npm run check:data
      - name: Commit refreshed data when changed
        run: |
          if git diff --quiet -- public/data/dashboard.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/dashboard.json
          git commit -m "chore(data): refresh ETF holdings"
          git push
